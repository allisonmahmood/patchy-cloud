packages:
  - "apps/*"
  - "packages/*"
  - "scripts/dev"
catalog:
  parse5: ^7.3.0
  # Effect 4 release candidates ship in lockstep; Dependabot bumps these
  # together (see .github/dependabot.yml). Only the language service has
  # its own release line.
  effect: 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/sql-pg": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  "@effect/language-service": 0.87.2
# Wait one day before resolving new releases so compromised versions have time to be removed.
minimumReleaseAge: 1440
# Excluded by name rather than by exact version so a Dependabot RC bump only
# has to touch the catalog; a fresh RC would otherwise be blocked for a day.
# The `@effect/*` glob is deliberate: an RC of @effect/platform-node pulls a
# matching @effect/platform-node-shared, and holding that back for a day would
# fail the install on the bump branch. The cost is that @effect/language-service
# also skips the gate. Delete this list once effect@4.0.0 is stable.
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
# Two copies of `effect` in the tree break Context/Layer identity, so every
# transitive `effect` resolves to the pinned RC. The @effect/* packages we
# depend on are pinned alongside it. pnpm overrides match exact names, not
# scope globs, so packages we only get transitively (today:
# @effect/platform-node-shared) follow their parent's exact range instead of
# being listed here -- a stale entry here would be worse than none.
overrides:
  effect: "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/language-service": "catalog:"
# embedded-postgres's beforeExit hook must preserve Vitest failures, not exit 0.
patchedDependencies:
  async-exit-hook@2.0.1: patches/async-exit-hook@2.0.1.patch
allowBuilds:
  esbuild: true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-arm": true
  "@embedded-postgres/linux-ia32": true
  "@embedded-postgres/linux-ppc64": true
  simple-git-hooks: true
  # Optional native msgpack accelerator pulled in by @effect/platform-node; the JS path is fine.
  msgpackr-extract: false
