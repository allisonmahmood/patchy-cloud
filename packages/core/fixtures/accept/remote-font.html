<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Remote font</title>
    <style>
      @font-face {
        font-family: "Remote";
        src: url("https://example.test/remote.woff2") format("woff2");
      }
      body {
        margin: 2rem;
        font:
          18px/1.5 "Remote",
          Georgia,
          serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Remote font</h1>
      <p>
        This page asks for a font from another site. Static pages block it, so it reads in serif.
      </p>
    </main>
  </body>
</html>
