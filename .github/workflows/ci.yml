name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum supported Node (engines >=22; pnpm 11 also
        # requires >=22.13). cli-smoke runs the packed real-server contract
        # entirely on Node 22, the floor the CLI has to keep working on.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  clerk-live:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PATCHY_PUBLIC_BASE_URL: http://127.0.0.1:3000
      CLERK_AUTHORIZED_PARTIES: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify live Clerk API and browser workflows
        run: pnpm test:clerk
      - name: Sweep this run's Clerk fixtures
        if: always()
        run: pnpm test:clerk --cleanup

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise packed CLI harness lifecycle probes
        run: |
          node scripts/packed-cli-e2e.mjs --platform-probes
          node scripts/packed-cli-e2e.mjs --lifecycle-probes
          node scripts/packed-cli-e2e.mjs --signal-probes
      - name: Exercise the packed CLI against an isolated real server
        env:
          PATCHY_API_TOKEN: ambient-invalid-token
          PATCHY_API_URL: http://127.0.0.1:9/ambient-poison
          PATCHY_MAX_HTML_BYTES: "1"
          PATCHY_UNKNOWN_AMBIENT_POISON: must-not-leak
        run: pnpm test:packed-cli-e2e

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
