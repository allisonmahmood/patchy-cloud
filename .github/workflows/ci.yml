name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The labels are the required check names; each runs an exact version, bumped
        # by hand (docs/DEVELOPMENT.md). 22.22.0 is the minimum PostHog requires and
        # 24.20.0 is production's, the node:24-slim digest in apps/server/Dockerfile.
        node-version: [22, 24, 26]
        include:
          - node-version: 22
            exact-version: 22.22.0
          - node-version: 24
            exact-version: 24.20.0
          - node-version: 26
            exact-version: 26.11.1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.exact-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  postgres-concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify SDK concurrency on isolated real Postgres
        run: pnpm test:postgres-concurrency

  clerk-live:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PATCHY_PUBLIC_BASE_URL: http://127.0.0.1:3000
      CLERK_AUTHORIZED_PARTIES: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        uses: ./.github/actions/playwright
      - name: Verify live Clerk API and browser workflows
        run: pnpm test:clerk
      - name: Sweep this run's Clerk fixtures
        if: always()
        run: pnpm test:clerk --cleanup

  pidgeon-live:
    # Pidgeon's test mode, with the repository's test admin key. Every run shares that account's
    # budgets, so the suite paces its calls (two runs at once stay under 120 a minute) and waits
    # out any 429; no concurrency group, which would cancel a queued run's check. Without the
    # secret, the job says so and passes.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIDGEON_TEST_ADMIN_KEY: ${{ secrets.PIDGEON_TEST_ADMIN_KEY }}
    steps:
      - name: Skip without a Pidgeon test key
        if: env.PIDGEON_TEST_ADMIN_KEY == ''
        run: echo "No PIDGEON_TEST_ADMIN_KEY secret, so the live Pidgeon tier doesn't run."
      - uses: actions/checkout@v7
        if: env.PIDGEON_TEST_ADMIN_KEY != ''
      - uses: pnpm/action-setup@v6
        if: env.PIDGEON_TEST_ADMIN_KEY != ''
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        if: env.PIDGEON_TEST_ADMIN_KEY != ''
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.PIDGEON_TEST_ADMIN_KEY != ''
      - name: Verify Pidgeon connections against Pidgeon's test mode
        if: env.PIDGEON_TEST_ADMIN_KEY != ''
        run: pnpm test:pidgeon

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Synthesize the infrastructure with example context, offline
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: pnpm --filter @patchy/infra synth:example

  cli-smoke:
    # The supported minimum keeps the original check name; Node 26 is what most new users install.
    name: ${{ matrix.node-version == 26 && 'cli-smoke (26)' || 'cli-smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
        include:
          - node-version: 22
            exact-version: 22.22.0
          - node-version: 26
            exact-version: 26.11.1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.exact-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        uses: ./.github/actions/playwright
      - name: Check the packed CLI harness reaps orphaned processes
        run: node scripts/packed-cli-e2e.mjs --cleanup-check
      - name: Exercise the packed CLI against an isolated real server
        env:
          PATCHY_API_TOKEN: ambient-invalid-token
          PATCHY_API_URL: http://127.0.0.1:9/ambient-poison
          PATCHY_MAX_HTML_BYTES: "1"
          PATCHY_UNKNOWN_AMBIENT_POISON: must-not-leak
          PATCHY_S3_BUCKET: ambient-poison
          PATCHY_S3_ENDPOINT: http://127.0.0.1:9/must-not-reach-storage
          PATCHY_S3_REGION: us-east-1
          PATCHY_S3_ACCESS_KEY_ID: ambient-invalid-key
          PATCHY_S3_SECRET_ACCESS_KEY: ambient-invalid-secret
        run: pnpm test:packed-cli-e2e
      - name: Exercise the packed Preact runtime and same-version upgrades
        run: pnpm test:packed-preact-e2e

  # The release, packed once on Linux for the install checks on every platform.
  release-tarball:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=patchy
      - uses: actions/upload-artifact@v7
        with:
          name: patchy-release
          path: packages/patchy/artifacts/
          if-no-files-found: error
          retention-days: 7

  # The installer and CLI where people run them: each platform's install line, a
  # Node switch, an earlier install moving, setup's links and the old-Node refusal.
  # Only Node and the packed release; `pnpm test:packed-install-e2e`.
  install:
    name: install (${{ matrix.os }})
    needs: release-tarball
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: patchy-release
          path: packages/patchy/artifacts
      # The supported minimum, then the Node most new users install; the switch is between them.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
      - run: echo "NODE_A=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
      - run: echo "NODE_B=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - name: Install, switch Node and move an earlier install
        run: node scripts/packed-install-e2e.mjs --node-a "$NODE_A" --node-b "$NODE_B"

  tier2-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        uses: ./.github/actions/playwright
      - name: Exercise the packed tier 2 journey against an isolated real server
        run: pnpm test:packed-tier2-e2e

  # A deploy of the PR and a rollback to the live release, rehearsed on one set of
  # data when the PR changes a migration, the handler descriptor schemas, the CLI code
  # that writes descriptors, or the rehearsal; otherwise it passes at once, so the
  # check can be required. `pnpm test:rollback-rehearsal`.
  rollback-rehearsal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The Deploy runs, which say whether production's commit is settled.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, the base branch: the PR's own changes.
          fetch-depth: 2
      - name: Look for a changed migration or handler descriptor
        id: changed
        run: |
          if git diff --quiet HEAD^1 HEAD -- ':(glob)**/src/migrations.ts' \
            packages/api/src/handlers.ts \
            packages/patchy/src/server.ts packages/patchy/src/config.ts \
            packages/patchy/src/handlerDescriptors.ts \
            packages/patchy/src/guest.ts packages/patchy/src/serverBuild.ts \
            packages/patchy/src/serverModules.ts packages/patchy/src/repoBuild.ts \
            scripts/rollback-rehearsal.ts; then
            echo "No migration or handler descriptor changed, so there is no rollback to rehearse."
          else
            echo "rehearse=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.changed.outputs.rehearse
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.rehearse
        with:
          # Production's Node, the node:24-slim digest in apps/server/Dockerfile.
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changed.outputs.rehearse
      - name: Install Chromium
        if: steps.changed.outputs.rehearse
        uses: ./.github/actions/playwright
      - name: Rehearse a deploy and a rollback on one set of data
        if: steps.changed.outputs.rehearse
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm test:rollback-rehearsal

  # Tier 1 and 2 pages in Chromium against an isolated server; `pnpm test:browser`.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        uses: ./.github/actions/playwright
      - name: Exercise tier 1 and 2 pages in Chromium
        run: pnpm test:browser

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
