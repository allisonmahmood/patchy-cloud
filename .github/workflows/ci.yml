name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchy
          POSTGRES_PASSWORD: patchy
          POSTGRES_DB: patchy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchy -d patchy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PATCHY_TEST_DATABASE_URL: postgresql://patchy:patchy@127.0.0.1:5432/patchy_test
      PATCHY_REQUIRE_POSTGRES_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum supported Node (engines >=22; pnpm 11 also
        # requires >=22.13). cli-smoke runs the packed real-server contract
        # entirely on Node 22, the floor the CLI has to keep working on.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node-version }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Prove the shared database contract runs against PostgreSQL
        run: pnpm --filter @patchy/db exec vitest run src/upload-contract.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:docker-save
      - run: pnpm lint
      - run: pnpm typecheck

  cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise packed CLI harness lifecycle probes
        run: |
          node scripts/packed-cli-e2e.mjs --platform-probes
          node scripts/packed-cli-e2e.mjs --lifecycle-probes
          node scripts/packed-cli-e2e.mjs --signal-probes
      - name: Exercise the packed CLI against an isolated real server
        env:
          PATCHY_API_TOKEN: ambient-invalid-token
          PATCHY_API_URL: http://127.0.0.1:9/ambient-poison
          PATCHY_MAX_HTML_BYTES: "1"
          PATCHY_UNKNOWN_AMBIENT_POISON: must-not-leak
        run: pnpm test:packed-cli-e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify server image
        shell: bash
        env:
          VERSION: 0.0.0-ci
          REVISION: "0000000000000000000000000000000000000000"
        run: |
          set -euo pipefail

          image="patchy-server:ci"
          docker build \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            -f apps/server/Dockerfile \
            -t "$image" .

          artifact_dir="$RUNNER_TEMP/server-image-artifact"
          filename="patchy-server-${VERSION}.tar"
          mkdir -p "$artifact_dir"
          docker save "$image" --output "$artifact_dir/$filename"
          tar_sha256="$(sha256sum "$artifact_dir/$filename" | awk '{print $1}')"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          node scripts/validate-docker-save-artifact.mjs \
            --artifact-dir "$artifact_dir" \
            --expected-filename "$filename" \
            --expected-sha256 "$tar_sha256" \
            --expected-repo-tag "$image" \
            --expected-config-id "$image_id"

          scripts/verify-server-image.sh "$image" "$VERSION" "$REVISION"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
