# Path -> area label mapping for .github/workflows/pr-labels.yml
#
# The areas follow CONTEXT-MAP.md so pull requests and the domain docs stay in
# one vocabulary: `area:server` is the hosting side (apps/server and its
# packages: analytics, api, auth, content-store, limits, patches, serving, sql),
# `area:cli` the Publishing context, `area:core` the shared kernel. The table in
# docs/agents/triage-labels.md says the same thing; change both together.
#
# A pull request can carry several area labels; that is intended.

"area:server":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/server/**"
          - "packages/analytics/**"
          - "packages/api/**"
          - "packages/auth/**"
          - "packages/content-store/**"
          - "packages/limits/**"
          - "packages/patches/**"
          - "packages/serving/**"
          - "packages/sql/**"

"area:cli":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/cli/**"
          # Single-sourced into packages/cli and shipped with it.
          - "skills/**"

"area:core":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/core/**"

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
          # Root-level workspace and tooling config. These patterns have no
          # slash, so they match only at the root -- packages/*/package.json
          # and packages/*/tsconfig.json belong to their own package's area.
          - "turbo.json"
          - "pnpm-workspace.yaml"
          - "pnpm-lock.yaml"
          - "package.json"
          - "tsconfig*.json"
          - "*.config.js"
          - "skills-lock.json"
          - ".dockerignore"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
          # Sample artifacts that demonstrate published output.
          - "examples/**"
