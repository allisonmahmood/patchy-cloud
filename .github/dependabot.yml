version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Patch releases are low-risk enough to review together. Minor and major
    # releases stay ungrouped, so each dependency gets its own pull request.
    versioning-strategy: increase
    open-pull-requests-limit: 20
    groups:
      # Effect 4 release candidates ship in lockstep and are pinned through the
      # pnpm catalog, so every new RC lands as one pull request. Dependabot only
      # follows prereleases while the pinned version is itself a prerelease of
      # the same release (4.0.0-rc.N -> 4.0.0-rc.M); once 4.0.0 ships it moves
      # to stable and stops following 4.x prereleases, which is what we want.
      # .github/workflows/pr-labels.yml tags these PRs `effect-rc-bump`; the
      # runbook for finishing one lives in AGENTS.md -> Effect RC bumps.
      #
      # The members are named one by one rather than as `@effect/*`. Dependabot
      # assigns a dependency to the group with the most specific pattern, and a
      # group with no patterns (patch-updates below) outranks a wildcard, so the
      # glob handed every `@effect/*` package to patch-updates; that group
      # refuses an RC bump as not a patch release and lets the package fall
      # through to a pull request of its own (#273, #344). An exact name beats
      # any other group; the packages still sit in patch-updates as well, and
      # stay out of its pull request only because this group runs first. Add
      # an @effect package here when it joins the RC lockstep (the 4.0.0-rc
      # entries in the pnpm-workspace.yaml catalog); @effect/language-service
      # is left out on purpose because it has its own release line.
      effect:
        patterns:
          - effect
          - "@effect/platform-node"
          - "@effect/sql-pg"
          - "@effect/sql-pglite"
          - "@effect/vitest"
      patch-updates:
        update-types:
          - patch
    ignore:
      # Deliberately pinned to the minimum supported runtime major (engines >=22.22.0);
      # typechecking against newer node types would undermine that claim.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
