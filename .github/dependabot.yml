version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Patch releases are low-risk enough to review together. Minor and major
    # releases stay ungrouped, so each dependency gets its own pull request.
    versioning-strategy: increase
    open-pull-requests-limit: 20
    groups:
      # Effect and its @effect/* packages share one version and release
      # together, and the pnpm-workspace.yaml overrides pin every transitive
      # `effect` to the catalog, so a bump of one package alone fails. This
      # group keeps a release in one pull request.
      #
      # The members are named one by one rather than as `@effect/*`. Dependabot
      # assigns a dependency to the group with the most specific pattern, and a
      # group with no patterns (patch-updates below) outranks a wildcard, so the
      # glob handed every `@effect/*` package to patch-updates; that group
      # refuses anything but a patch release and lets the package fall through
      # to a pull request of its own (#273, #344). An exact name beats any
      # other group. Add an @effect package here when it joins the catalog;
      # @effect/language-service is left out on purpose because it has its own
      # release line.
      effect:
        patterns:
          - effect
          - "@effect/platform-node"
          - "@effect/sql-pg"
          - "@effect/sql-pglite"
          - "@effect/vitest"
      # The CDK library and CLI release weekly, in step; review them together.
      aws-cdk:
        patterns:
          - aws-cdk
          - aws-cdk-lib
          - constructs
      patch-updates:
        update-types:
          - patch
    ignore:
      # Deliberately pinned to the minimum supported runtime major (engines >=22.22.0);
      # typechecking against newer node types would undermine that claim.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
