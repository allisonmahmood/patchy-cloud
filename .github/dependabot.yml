version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Patch releases are low-risk enough to review together. Minor and major
    # releases stay ungrouped, so each dependency gets its own pull request.
    versioning-strategy: increase
    open-pull-requests-limit: 20
    groups:
      # Effect 4 release candidates ship in lockstep and are pinned through the
      # pnpm catalog, so every new RC lands as one pull request. Dependabot only
      # follows prereleases while the pinned version is itself a prerelease of
      # the same release (4.0.0-rc.N -> 4.0.0-rc.M); once 4.0.0 ships it moves
      # to stable and stops following 4.x prereleases, which is what we want.
      # .github/workflows/pr-labels.yml tags these PRs `effect-rc-bump` so an
      # agent picks each one up and finishes it against MIGRATION.md.
      effect:
        patterns:
          - effect
          - "@effect/*"
        # The language service has its own release line; let it flow as an
        # ordinary update instead of muddying the RC changelog.
        exclude-patterns:
          - "@effect/language-service"
      patch-updates:
        update-types:
          - patch
    ignore:
      # Deliberately pinned to the minimum supported runtime (engines >=22);
      # typechecking against newer node types would undermine that claim.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
