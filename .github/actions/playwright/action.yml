name: Install Chromium
description: >-
  Installs Playwright's Chromium, restoring it from the Actions cache when this
  runner image and Playwright version already have it. Use after `pnpm install`.

runs:
  using: composite
  steps:
    - name: Key the cache on the runner image and Playwright version
      id: key
      shell: bash
      run: |
        version=$(pnpm exec playwright --version | cut -d' ' -f2)
        echo "key=playwright-chromium-$ImageOS-$RUNNER_ARCH-$version" >> "$GITHUB_OUTPUT"

    - name: Restore Chromium
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.key.outputs.key }}

    # No `--with-deps`. The runner image ships Google Chrome and Chromium, so it
    # already has every library Playwright's Chromium loads; Playwright names any
    # that go missing when it launches. The rest of `--with-deps` is xvfb and
    # extra fonts, which the headless suites don't need, and fetching them from a
    # slow apt mirror pushed jobs past their time limit.
    - name: Download Chromium
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install chromium

    # Saved now rather than at the end of the job, so a failing test still
    # leaves the browser for the next run.
    - name: Save Chromium
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.key.outputs.key }}
