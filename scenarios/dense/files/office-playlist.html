<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office playlist · Brightline Studio</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #1d1b16;
        background: #fbfaf6;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 18px;
        margin: 32px 0 8px;
      }
      p.lede {
        color: #5e5950;
        margin: 0 0 24px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 8px 12px 8px 0;
        border-bottom: 1px solid #e7e5dd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Office playlist</h1>
      <p class="lede">What the studio speakers play this month, and how to add a song.</p>
      <h2>This month</h2>
      <ul>
        <li>Monday mornings: quiet piano</li>
        <li>Friday afternoons: anything with a chorus</li>
      </ul>
      <p>Add a song by writing it on the card by the kitchen.</p>
    </main>
  </body>
</html>
